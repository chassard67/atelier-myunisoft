# Déploie le serveur de licences (Cloudflare Worker) à chaque publication.
# Inactif tant que les secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# ne sont pas définis (voir server/README.md).
name: Déployer le serveur de licences

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'publish.json', 'server/**', 'tools/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire dist/ puis le bundle du Worker
        run: |
          node tools/build.mjs
          node tools/build-worker.mjs
      - name: Déployer le Worker
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy
